<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Versand-Scanner">
<meta name="theme-color" content="#1a1917">
<title>Versand-Scanner</title>
<link rel="manifest" href="data:application/json,{
  &quot;name&quot;: &quot;Versand-Scanner&quot;,
  &quot;short_name&quot;: &quot;Scanner&quot;,
  &quot;start_url&quot;: &quot;.&quot;,
  &quot;display&quot;: &quot;standalone&quot;,
  &quot;background_color&quot;: &quot;#f5f4f1&quot;,
  &quot;theme_color&quot;: &quot;#1a1917&quot;,
  &quot;orientation&quot;: &quot;portrait&quot;
}">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f5f4f1;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: #e2e0d8;
    --border2: #d0cec4;
    --text: #1a1917;
    --text2: #6b6860;
    --text3: #a8a69f;
    --blue: #2563eb;
    --blue-light: #eff4ff;
    --blue-text: #1d4ed8;
    --green: #16a34a;
    --green-light: #f0fdf4;
    --green-text: #15803d;
    --red: #dc2626;
    --red-light: #fef2f2;
    --red-text: #b91c1c;
    --amber: #d97706;
    --amber-light: #fffbeb;
    --amber-text: #b45309;
    --purple: #7c3aed;
    --purple-light: #f5f3ff;
    --purple-text: #6d28d9;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Prevent ANY element from overflowing */
  * { max-width: 100%; }

  .hidden { display: none !important; }

  /* ── Modal Overlay ── */
  .modal-overlay {
    min-height: 100vh;
    background: rgba(0,0,0,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem 2rem 1.75rem;
    width: 100%;
    max-width: 360px;
    box-shadow: var(--shadow);
  }
  .modal-logo {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 1.5rem;
  }
  .modal-logo .icon-box {
    width: 36px; height: 36px;
    background: var(--text); border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-logo .icon-box svg { width: 18px; height: 18px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .modal-logo span { font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
  .modal-title { font-size: 14px; font-weight: 600; color: var(--text2); margin-bottom: 1.25rem; }

  /* ── App Shell (admin) ── */
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--text); color: white;
    display: flex; flex-direction: column;
    padding: 1.25rem 0;
  }
  .sidebar-logo {
    display: flex; align-items: center; gap: 10px;
    padding: 0 1.25rem 1.5rem;
    border-bottom: 1px solid rgba(255,255,255,.1);
    margin-bottom: 1rem;
  }
  .sidebar-logo .icon-box {
    width: 34px; height: 34px;
    background: rgba(255,255,255,.15); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .sidebar-logo .icon-box svg { width: 16px; height: 16px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sidebar-logo span { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 1.25rem; cursor: pointer;
    color: rgba(255,255,255,.65); font-size: 13.5px;
    transition: all .15s;
    border: none; background: none; width: 100%; text-align: left;
  }
  .nav-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .nav-item:hover { color: white; background: rgba(255,255,255,.08); }
  .nav-item.active { color: white; background: rgba(255,255,255,.15); font-weight: 500; }
  .nav-item .cnt { margin-left: auto; background: rgba(255,255,255,.2); border-radius: 20px; font-size: 11px; padding: 1px 7px; }
  .sidebar-bottom { margin-top: auto; padding: 0 1.25rem; border-top: 1px solid rgba(255,255,255,.1); padding-top: 1rem; }
  .user-chip { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,.75); font-size: 13px; }
  .user-chip .avatar { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .user-chip .name { flex: 1; font-weight: 500; }
  .logout-btn { background: none; border: none; cursor: pointer; color: rgba(255,255,255,.5); padding: 4px; border-radius: 4px; transition: color .15s; }
  .logout-btn:hover { color: white; }
  .logout-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .main { flex: 1; overflow-y: auto; }
  .main-inner { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* ── Scanner layout (no login required) ── */
  .scanner-page { max-width: 100vw; width: 100%; margin: 0; padding: 10px; overflow-x: hidden; }
  .scanner-topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.5rem; gap: 8px;
  }
  .scanner-topbar-left { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .scanner-topbar-left svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Forms ── */
  label.field-lbl { display: block; font-size: 12px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
  input[type=text], input[type=password], input[type=date], select {
    width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 8px 11px; font-size: 14px; font-family: 'DM Sans', sans-serif;
    background: var(--surface); color: var(--text); transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .field-row { margin-bottom: 14px; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--border2); background: var(--surface);
    color: var(--text); font-size: 13.5px; font-family: 'DM Sans', sans-serif;
    cursor: pointer; font-weight: 500; transition: all .15s; white-space: nowrap;
  }
  .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .btn:hover { background: var(--surface2); }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--text); color: white; border-color: var(--text); }
  .btn-primary:hover { background: #2d2b28; border-color: #2d2b28; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn-danger { border-color: #fca5a5; color: var(--red); }
  .btn-danger:hover { background: var(--red-light); }
  .btn-full { width: 100%; justify-content: center; padding: 10px; }
  .btn-sm { padding: 5px 11px; font-size: 12.5px; }

  /* ── Cards ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
  .card-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 1rem; }

  /* ── Fili Grid ── */
  .fili-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
  .fili-btn {
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 6px; text-align: center; cursor: pointer;
    background: var(--surface); color: var(--text); font-size: 13px;
    font-family: 'DM Sans', sans-serif; font-weight: 500; transition: all .15s;
  }
  .fili-btn:hover { background: var(--surface2); }
  .fili-btn.sel { background: var(--text); color: white; border-color: var(--text); }
  .dest-row { margin-top: 10px; font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .dest-row svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dest-row .pill { background: var(--green-light); color: var(--green-text); border-radius: 20px; padding: 2px 10px; font-weight: 600; font-size: 12px; }

  /* ── Parsed ── */
  .parsed-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .pfield { background: var(--surface2); border-radius: var(--radius-sm); padding: 9px 11px; }
  .pfield .pl { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .pfield .pv { font-size: 15px; font-weight: 600; }
  .breakdown { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); margin-top: 8px; }
  .fmt-badge { display: inline-block; border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
  .fmt-a { background: var(--purple-light); color: var(--purple-text); }
  .fmt-b { background: var(--amber-light); color: var(--amber-text); }
  .fmt-err { background: var(--red-light); color: var(--red-text); }

  /* ── Log ── */
  .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .filter-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .tbl-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--surface2); padding: 9px 12px; text-align: left; font-weight: 600; font-size: 11.5px; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .sz-pill { background: var(--green-light); color: var(--green-text); border-radius: 20px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
  .mono { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text2); }
  .log-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
  .log-info { font-size: 13px; color: var(--text2); }
  .page-header { margin-bottom: 1.5rem; }
  .page-header h1 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  .page-header p { color: var(--text2); font-size: 13px; margin-top: 3px; }

  /* ── Users ── */
  .user-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .user-row:last-child { border-bottom: none; }
  .u-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--text2); flex-shrink: 0; border: 1px solid var(--border); }
  .badge { display: inline-block; border-radius: 20px; padding: 2px 9px; font-size: 11px; font-weight: 600; }
  .badge-admin { background: var(--purple-light); color: var(--purple-text); }
  .badge-user { background: var(--blue-light); color: var(--blue-text); }
  .err-msg { font-size: 12.5px; color: var(--red); margin-top: 6px; display: none; }
  .fb-msg { font-size: 13px; color: var(--green); text-align: center; min-height: 18px; margin-top: 8px; }

  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; box-shadow: var(--shadow); }
  .stat-card .sl { font-size: 11.5px; color: var(--text2); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .stat-card .sv { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .filter-grid, .filter-grid2 { grid-template-columns: 1fr; }
    .parsed-grid { grid-template-columns: 1fr 1fr; }
    .stats-row { grid-template-columns: 1fr 1fr; }
  }

  /* ── Zebra TC21 Optimierungen (480x800px) ── */
  @media (max-width: 900px) {
    html { font-size: 20px; }
    body { font-size: 20px; }

    /* Full width layout */
    .scanner-page { padding: 10px; width: 100%; max-width: 100%; }
    .main-inner { padding: 12px; }

    /* Topbar */
    .scanner-topbar { margin-bottom: 10px; }
    .scanner-topbar-left { font-size: 22px; font-weight: 700; gap: 8px; }
    .scanner-topbar-left svg { width: 24px; height: 24px; }
    #open-log-btn { min-height: 52px; font-size: 16px; padding: 12px 18px; }

    /* Filiale Grid - 4 per row on TC21 */
    .fili-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .fili-btn {
      padding: 20px 4px;
      font-size: 20px;
      min-height: 64px;
      font-weight: 700;
      border-width: 2px;
      border-radius: 8px;
    }

    /* Cards */
    .card { padding: 14px 12px; margin-bottom: 10px; border-radius: 10px; }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; letter-spacing: .06em; }

    /* Labels */
    label.field-lbl { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .field-row { margin-bottom: 16px; }

    /* Inputs - large for touch/scanner */
    input[type=text], input[type=password], input[type=date],
    input[type=number], select {
      padding: 18px 14px;
      font-size: 20px;
      min-height: 62px;
      border-radius: 8px;
      border-width: 2px;
      width: 100%;
    }

    /* Buttons */
    .btn { padding: 14px 20px; font-size: 17px; min-height: 54px; }
    .btn-sm { padding: 12px 16px; font-size: 16px; min-height: 50px; }
    .btn-full { padding: 20px; font-size: 20px; min-height: 72px; font-weight: 700; }
    .btn svg { width: 20px; height: 20px; }

    /* Submit */
    button[id$="-submit"] {
      min-height: 76px !important;
      font-size: 22px !important;
      font-weight: 700 !important;
      border-radius: 10px !important;
    }

    /* Dest row */
    .dest-row { font-size: 17px; margin-top: 12px; gap: 8px; }
    .dest-row .pill { font-size: 16px; padding: 5px 16px; }

    /* Active bar */
    div[id$="-active-bar"] {
      padding: 14px 16px !important;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    div[id$="-active-fili"],
    div[id$="-active-dest"] { font-size: 22px !important; }

    /* Parsed fields */
    .parsed-grid { grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
    .pfield { padding: 12px 10px; border-radius: 8px; }
    .pfield .pl { font-size: 12px; margin-bottom: 4px; }
    .pfield .pv { font-size: 22px; font-weight: 700; }
    .fmt-badge { font-size: 15px; padding: 5px 14px; margin-bottom: 10px; }
    .breakdown { font-size: 13px; margin-top: 8px; }

    /* Overlay */
    div[id$="-fili-overlay"] { font-size: 18px !important; gap: 10px !important; }
    div[id$="-fili-overlay"] svg { width: 22px !important; height: 22px !important; }

    /* Progress */
    div[id$="-progress"] { padding: 14px 12px; }
    span[id$="-prog-done"],
    span[id$="-prog-total"] { font-size: 30px !important; }
    div[id$="-scan-list"] > div { padding: 12px 10px; font-size: 16px; }

    /* Feedback */
    .fb-msg { font-size: 18px; min-height: 24px; margin-top: 10px; }

    /* Manual toggle */
    button[id$="-manual-toggle"] { font-size: 16px; min-height: 48px; }

    /* Error */
    .err-msg { font-size: 15px; margin-top: 6px; }

    /* Manuell grid */
    div[id$="-scan2-manual"] > div > div { gap: 10px; }

    /* Log table on mobile */
    .tbl-wrap { font-size: 15px; }
    th { font-size: 13px; padding: 10px 8px; }
    td { padding: 10px 8px; font-size: 15px; }

    /* Stats */
    .stat-card .sv { font-size: 28px; }
    .stat-card .sl { font-size: 13px; }
    .stats-row { gap: 8px; margin-bottom: 14px; }

    /* Filter inputs */
    .filter-grid, .filter-grid2 { grid-template-columns: 1fr; gap: 10px; }

    /* Login modal */
    .modal-card { padding: 1.75rem 1.25rem; }
    .modal-logo span { font-size: 18px; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .filter-grid, .filter-grid2 { grid-template-columns: 1fr; }
    .parsed-grid { grid-template-columns: 1fr 1fr; }
    .stats-row { grid-template-columns: 1fr 1fr; }
  }

  /* ── Zebra / Mobile Optimierungen ── */
  @media (max-width: 900px) {
    html { font-size: 18px; }
    body { font-size: 18px; background: var(--bg); }

    .scanner-page { padding: 12px; max-width: 100%; width: 100%; }
    .scanner-topbar { margin-bottom: 12px; padding: 0; }
    .scanner-topbar-left { font-size: 20px; font-weight: 700; }

    /* Filiale buttons - big and tappable */
    .fili-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .fili-btn { padding: 18px 6px; font-size: 18px; min-height: 60px; font-weight: 700; border-width: 2px; }
    .fili-btn.sel { border-width: 2px; }

    /* Cards */
    .card { padding: 14px; margin-bottom: 12px; border-radius: 10px; }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; letter-spacing: .08em; }

    /* Inputs */
    input[type=text], input[type=password], input[type=date],
    input[type=number], select {
      padding: 16px 14px;
      font-size: 18px;
      min-height: 58px;
      border-radius: 8px;
      border-width: 2px;
    }
    label.field-lbl { font-size: 14px; margin-bottom: 8px; }
    .field-row { margin-bottom: 16px; }

    /* Buttons */
    .btn { padding: 14px 20px; font-size: 16px; min-height: 52px; border-width: 1.5px; }
    .btn-sm { padding: 12px 16px; font-size: 15px; min-height: 48px; }
    .btn-full { padding: 18px; font-size: 18px; min-height: 64px; font-weight: 700; }
    .btn svg { width: 18px; height: 18px; }

    /* Submit button very large */
    button[id$="-submit"] { min-height: 70px !important; font-size: 20px !important; font-weight: 700 !important; }

    /* Parsed fields */
    .parsed-grid { grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
    .pfield { padding: 12px; }
    .pfield .pl { font-size: 12px; }
    .pfield .pv { font-size: 20px; font-weight: 700; }
    .breakdown { font-size: 13px; margin-top: 8px; line-height: 1.5; }
    .fmt-badge { font-size: 14px; padding: 5px 14px; margin-bottom: 10px; }

    /* Active bar */
    div[id$="-active-bar"] { padding: 14px 16px !important; font-size: 16px !important; margin-bottom: 12px; }
    div[id$="-active-fili"], div[id$="-active-dest"] { font-size: 20px !important; }

    /* Dest row */
    .dest-row { font-size: 16px; margin-top: 12px; }
    .dest-row .pill { font-size: 15px; padding: 5px 14px; }

    /* Progress */
    div[id$="-progress"] { padding: 14px; }
    span[id$="-prog-done"], span[id$="-prog-total"] { font-size: 26px !important; }
    div[id$="-scan-list"] > div { padding: 12px 14px; font-size: 15px; }

    /* Log/Admin btn */
    #open-log-btn { min-height: 48px; font-size: 15px; padding: 12px 16px; }

    /* Overlay text */
    div[id$="-fili-overlay"] { font-size: 16px !important; }

    /* Feedback */
    .fb-msg { font-size: 16px; min-height: 22px; margin-top: 10px; }

    /* Manual toggle */
    button[id$="-manual-toggle"] { font-size: 15px; min-height: 44px; }

    /* Error messages */
    .err-msg { font-size: 14px; }

    /* Topbar title for scanner */
    .scanner-topbar-left svg { width: 22px; height: 22px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ═══════════════════════════════════════════════

// ── Offline Queue ────────────────────────────────────
const QUEUE_KEY = 'vs_offline_queue';

function loadQueue() {
  try { const s = localStorage.getItem(QUEUE_KEY); return s ? JSON.parse(s) : []; } catch(e){ return []; }
}
function saveQueue(q) {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch(e){}
}
function addToQueue(entry) {
  const q = loadQueue();
  q.push(entry);
  saveQueue(q);
}

async function syncQueue() {
  const q = loadQueue();
  if(!q.length) return;
  const failed = [];
  for(const entry of q) {
    const result = await apiPost(entry);
    if(!result || result.error) failed.push(entry);
  }
  saveQueue(failed);
  if(failed.length < q.length) {
    const synced = q.length - failed.length;
    showSyncNotice(synced + ' offline Scan(s) synchronisiert ✓');
  }
}

function showSyncNotice(msg) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#16a34a;color:white;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function showOfflineBadge(show) {
  let badge = document.getElementById('offline-badge');
  if(show) {
    if(!badge) {
      badge = document.createElement('div');
      badge.id = 'offline-badge';
      badge.style.cssText = 'position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#d97706;color:white;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;z-index:9999;';
      badge.textContent = '⚠ Offline – Daten werden lokal gespeichert';
      document.body.appendChild(badge);
    }
  } else {
    if(badge) badge.remove();
  }
}

// ── API Kommunikation ─────────────────────────────────
async function apiGet(params) {
  if(!API_URL || API_URL.includes('DEINE')) return null;
  try {
    const url = API_URL + '?' + new URLSearchParams(params);
    const res = await fetch(url);
    return await res.json();
  } catch(e) { console.warn('API Fehler:', e); return null; }
}
async function apiPost(data) {
  if(!API_URL || API_URL.includes('DEINE')) return null;
  try {
    const res = await fetch(API_URL, { method:'POST', body:JSON.stringify(data) });
    return await res.json();
  } catch(e) { console.warn('API Fehler:', e); return null; }
}

// Repariere alte Einträge ohne Größe (Migration)
(function migrateLog() {
  let changed = false;
  DB.log.forEach(e => {
    if ((!e.groesse || e.groesse === '–' || e.groesse === '') && e.rawBarcode) {
      const p = parseBarcode(e.rawBarcode);
      if (p.groesse && p.groesse !== '–') {
        e.groesse = p.groesse;
        if (!e.artno || e.artno === e.rawBarcode) e.artno = p.artno;
        changed = true;
      }
    }
  });
  if (changed) saveDB();
})();

function parseBarcode(raw) {
  raw = (raw||'').trim();
  const clean = raw.replace(/^\*+/,'');
  if (clean.startsWith('EA') && clean.length >= 17) {
    const a = clean.slice(2);
    return { artno:a.slice(5,17), groesse:a.slice(0,3), format:'A', valid:a.slice(5,17).length===12,
      breakdown:`EA | ${a.slice(0,3)} (Größe) | ${a.slice(3,5)} (ignore) | ${a.slice(5,17)} (ArtNr)` };
  }
  if (clean.startsWith('30') && clean.length >= 11) {
    const a = clean.slice(2);
    const artno = a.slice(0,6);
    const rest = a.slice(6);
    const groesse = rest.startsWith('0') ? rest.slice(0,3) : rest.slice(-3);
    const folge = rest.startsWith('0') ? '' : rest.slice(0,-3);
    const bdFolge = folge ? ` | ${folge} (Folge)` : '';
    return { artno, groesse, format:'B', valid:true,
      breakdown:`30 | ${artno} (ArtNr)${bdFolge} | ${groesse} (Größe)` };
  }
  return { artno:clean, groesse:'–', format:'?', valid:false, breakdown:'Format nicht erkannt' };
}

function showLoginModal() {
  const overlay = document.createElement('div');
  overlay.id = 'login-overlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="modal-logo">
        <div class="icon-box">${icons.lock}</div>
        <span>Versandlog &amp; Admin</span>
      </div>
      <div class="field-row"><label class="field-lbl">Benutzername</label><input type="text" id="ml-user" autocomplete="off" /></div>
      <div class="field-row"><label class="field-lbl">Passwort</label><input type="password" id="ml-pass" /></div>
      <div class="err-msg" id="ml-err">Benutzername oder Passwort falsch.</div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-full" id="ml-cancel">Abbrechen</button>
        <button class="btn btn-primary btn-full" id="ml-btn">${icons.arrow} Anmelden</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>r('ml-user').focus(), 50);

  const go = async () => {
    const u = r('ml-user').value.trim(), p = r('ml-pass').value;
    r('ml-btn').disabled = true;
    r('ml-btn').textContent = '...';
    // Try API login first
    const apiResult = await apiGet({action:'login', userId:u, password:p});
    r('ml-btn').disabled = false;
    r('ml-btn').innerHTML = icons.arrow + ' Anmelden';
    let found = null;
    if(apiResult && apiResult.success) {
      found = apiResult.user;
    } else {
      // Fallback to local
      found = DB.users.find(x => x.id===u && x.password===p);
    }
    if (found && found.role==='admin') {
      overlay.remove();
      currentUser = found;
      selFiliId = null;
      activeView = 'log';
      // Load data from API in parallel
      const [logResult, userResult] = await Promise.all([
        apiGet({action:'getLog'}),
        apiGet({action:'getUsers'})
      ]);
      if(logResult && logResult.log) { DB.log = logResult.log; saveDB(); }
      if(userResult && userResult.users) { DB.users = userResult.users; saveDB(); }
      render();
    } else {
      r('ml-err').style.display='block';
      r('ml-err').textContent = found ? 'Kein Admin-Zugriff.' : 'Benutzername oder Passwort falsch.';
    }
  };
  r('ml-btn').onclick = go;
  r('ml-pass').onkeydown = e => { if(e.key==='Enter') go(); };
  r('ml-cancel').onclick = () => overlay.remove();
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
}

function isToday(e) {
  if(!e.ts) return false;
  const ts = formatDisplayTS(e.ts);
  const now = new Date();
  const today = now.getDate()+'.'+(now.getMonth()+1)+'.'+now.getFullYear();
  return ts.startsWith(today);
}

      <div style="font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;">Gescannte Artikel</div>
      <button onclick="resetSession('${pfx}')" style="background:none;border:1px solid #fca5a5;border-radius:var(--radius-sm);color:var(--red);font-size:12px;font-family:'DM Sans',sans-serif;padding:3px 10px;cursor:pointer;font-weight:500;" title="Session zurücksetzen">↺ Zurücksetzen</button>
    </div>
    <div id="${pfx}-scan-list" style="display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;"></div>
  </div>`;
}
function isBarcode(v) {
  if(!v) return false;
  const c = v.replace(/^\*+/,'');
  // Format A: starts with EA + min 17 chars total
  if(c.startsWith('EA') && c.length>=17) return true;
  // Format B: starts with 30 + only digits (no dash) + min 11 chars
  if(c.startsWith('30') && c.length>=11 && !c.includes('-')) return true;
  return false;
}

function isOrderNumber(v) {
  if(!v) return false;
  // Bestellnummer: *602-700692 format - has dash or is short
  // NOT an article barcode
  return !isBarcode(v);
}

function bindScanForm(pfx) {
  const artEl = r(pfx+'-art'), orderEl = r(pfx+'-order');
  if(!artEl) return;
  const qtyEl = r(pfx+'-qty');
  if(qtyEl) {
    qtyEl.onkeydown = e => { if(e.key==='Enter') { e.preventDefault(); orderEl.focus(); } };
    qtyEl.oninput = () => {
      checkSubmit(pfx);
      // Auto-jump to order field as soon as a valid number is entered
      const val = parseInt(qtyEl.value);
      if(val > 0) {
        clearTimeout(qtyEl._jumpTimer);
        qtyEl._jumpTimer = setTimeout(() => { orderEl.focus(); }, 500);
      }
    };
    // Also jump on blur (when user taps away from qty field)
    qtyEl.onblur = () => {
      const val = parseInt(qtyEl.value);
      if(val > 0) setTimeout(() => orderEl.focus(), 100);
    };
  }

  orderEl.oninput = function() {
    const v = this.value.trim();
    const errEl = r(pfx+'-order-err');
    if(v && isBarcode(v)) {
      errEl.textContent = '⚠ Das sieht nach einem Artikelbarcode aus – bitte nur die Bestellnummer in Scan 1 eingeben.';
      errEl.style.display = 'block';
    } else {
      errEl.style.display = 'none';
    }
    checkSubmit(pfx);
  };

  artEl.oninput = function() {
    const v = this.value.trim();
    const errEl = r(pfx+'-art-err');
    r(pfx+'-raw').textContent = v ? 'Roh: '+v : '';
    if(v.length>3) {
      if(!isBarcode(v)) {
        errEl.textContent = '⚠ Format nicht erkannt – bitte Barcode scannen oder manuelle Eingabe verwenden.';
        errEl.style.display = 'block';
      } else {
        errEl.style.display = 'none';
      }
      const p = parseBarcode(v);
      r(pfx+'-artno').textContent = p.artno||'–';
      r(pfx+'-size').textContent = p.groesse||'–';
      r(pfx+'-fmtv').textContent = p.format==='A'?'Format A':p.format==='B'?'Format B':'Unbekannt';
      r(pfx+'-fmtbadge').innerHTML = p.format==='A'?'<span class="fmt-badge fmt-a">Format A – EA…</span>':
        p.format==='B'?'<span class="fmt-badge fmt-b">Format B – 30…</span>':'<span class="fmt-badge fmt-err">Unbekannt</span>';
      r(pfx+'-bd').textContent = p.breakdown||'';
      r(pfx+'-parsed').classList.remove('hidden');
    } else {
      r(pfx+'-parsed').classList.add('hidden');
      r(pfx+'-art-err').style.display='none';
    }
    checkSubmit(pfx);
    // Auto-submit 600ms after last keypress (scanner sends all chars rapidly then Enter)
    clearTimeout(artEl._autoTimer);
    artEl._autoTimer = setTimeout(()=>{
      const btn = r(pfx+'-submit');
      if(btn && !btn.disabled) doSubmit(pfx);
    }, 600);
  };

  orderEl.onkeydown = e => {
    if(e.key==='Enter') {
      e.preventDefault();
      clearTimeout(orderEl._jumpTimer);
      if(orderEl.value.trim()) {
        artEl.focus();
      }
    }
  };
  // Also: if scanner fills field quickly, jump after short delay
  orderEl.oninput = function() {
    clearTimeout(orderEl._jumpTimer);
    const v = this.value.trim();
    const errEl = r(pfx+'-order-err');
    // If an article barcode was scanned into order field - clear and warn
    if(v && isBarcode(v)) {
      orderEl.value = '';
      if(errEl) {
        errEl.textContent = '⚠ Artikelbarcode erkannt – bitte zuerst die Bestellnummer scannen!';
        errEl.style.display = 'block';
        setTimeout(() => { errEl.style.display = 'none'; }, 3000);
      }
      orderEl.focus();
      checkSubmit(pfx);
      return;
    }
    if(errEl) errEl.style.display = 'none';
    if(v.length > 2) {
      orderEl._jumpTimer = setTimeout(() => {
        if(!artEl.value.trim()) artEl.focus();
      }, 800);
    }
    checkSubmit(pfx);
  };
  artEl.onkeydown = e => {
    if(e.key==='Enter') {
      e.preventDefault();
      clearTimeout(artEl._autoTimer);
      const btn = r(pfx+'-submit');
      if(btn && !btn.disabled) doSubmit(pfx);
    }
  };

  // Keep focus on active field — Zebra scanner needs focused input
  // When screen is touched anywhere outside input, refocus active field
  document.addEventListener('touchend', function(ev) {
    const tag = ev.target.tagName;
    if(tag === 'INPUT' || tag === 'SELECT' || tag === 'BUTTON') return;
    // Refocus the right field based on what's filled
    setTimeout(() => {
      const o = r(pfx+'-order');
      const a = r(pfx+'-art');
      if(!o || !a) return;
      if(!o.value.trim()) { o.focus(); }
      else if(!a.value.trim() && !manualMode[pfx]) { a.focus(); }
    }, 100);
  }, {passive: true});

  // Refocus after scan completes (scanner may steal focus briefly)
  document.addEventListener('visibilitychange', function() {
    if(document.visibilityState === 'visible') {
      setTimeout(() => {
        const o = r(pfx+'-order');
        const a = r(pfx+'-art');
        if(!o || !a) return;
        if(!o.value.trim()) o.focus();
        else if(!a.value.trim() && !manualMode[pfx]) a.focus();
      }, 200);
    }
  });
  setTimeout(()=>orderEl.focus(), 50);
}

let manualMode = {};
window.toggleManual = function(pfx) {
  manualMode[pfx] = !manualMode[pfx];
  r(pfx+'-scan2-auto').classList.toggle('hidden', manualMode[pfx]);
  r(pfx+'-scan2-manual').classList.toggle('hidden', !manualMode[pfx]);
  r(pfx+'-parsed').classList.add('hidden');

    setTimeout(()=>{ const m=r(pfx+'-man-artno'); if(m) m.focus(); },50);
  } else {
    setTimeout(()=>{ const a=r(pfx+'-art'); if(a) a.focus(); },50);

  checkSubmit(pfx);
};
window.selFili = function(pfx, id) {
  try {
    selFiliId = id;
    document.querySelectorAll('.fili-btn').forEach(b=>b.classList.remove('sel'));
    const btn = r(pfx+'-fb-'+id); if(btn) btn.classList.add('sel');

function getQty(pfx) {
  const q = r(pfx+'-qty'); return q ? parseInt(q.value)||0 : 0;
}
function checkSubmit(pfx) {
  const btn = r(pfx+'-submit'); if(!btn) return;
  const qty = getQty(pfx);
  const orderVal = r(pfx+'-order') ? r(pfx+'-order').value.trim() : '';
  const orderOk = orderVal && !isBarcode(orderVal);
  let artOk;
  if(manualMode[pfx]) {
    artOk = r(pfx+'-man-artno') && r(pfx+'-man-artno').value.trim() && r(pfx+'-man-size') && r(pfx+'-man-size').value.trim();
  } else {
    artOk = r(pfx+'-art') && r(pfx+'-art').value.trim() && isBarcode(r(pfx+'-art').value.trim());
  }
  // Only enable if qty set and we haven't reached target yet
  const done = (scanSession[pfx]||[]).length;
  btn.disabled = !(selFiliId && qty > 0 && orderOk && artOk && done < qty);
}
let scanSession = {};

window.doSubmit = function(pfx) {
  if(!selFiliId) return;
  const order = r(pfx+'-order').value.trim();
  if(!order) return;
  const qty = getQty(pfx);
  if(!qty) return;
  let p, raw;
  if(manualMode[pfx]) {
    const manArt = r(pfx+'-man-artno').value.trim();
    const manSize = r(pfx+'-man-size').value.trim();
    if(!manArt||!manSize) return;
    p = { artno:manArt, groesse:manSize, format:'M', valid:true };
    raw = 'Manuell';
  } else {
    raw = r(pfx+'-art').value.trim();
    if(!raw) return;
    p = parseBarcode(raw);
  }
  const dest = FILIALEN.find(f=>f.id===selFiliId).dest;
  const now = new Date();
  // Store as text with leading apostrophe trick won't work via API
  // Use DD.MM.YYYY format with leading zeros so Sheets treats it as text not date
  const ts = String(now.getDate()).padStart(2,'0')+'.'+
    String(now.getMonth()+1).padStart(2,'0')+'.'+now.getFullYear()+' '+
    String(now.getHours()).padStart(2,'0')+':'+
    String(now.getMinutes()).padStart(2,'0')+':'+
    String(now.getSeconds()).padStart(2,'0');
  const entry = {ts,fili:selFiliId,dest,order,artno:p.artno,groesse:p.groesse,format:p.format,rawBarcode:raw,
    user: currentUser ? currentUser.name : 'Fili '+selFiliId};
  DB.log.unshift(entry);
  saveDB();
  // Save to API or queue if offline
  if(navigator.onLine) {
    apiPost({action:'addLog', ...entry});
  } else {
    addToQueue({action:'addLog', ...entry});
  }
  // Keep order & qty; only clear article fields for next scan in session
  if(manualMode[pfx]) {
    if(r(pfx+'-man-artno')) r(pfx+'-man-artno').value='';
    if(r(pfx+'-man-size')) r(pfx+'-man-size').value='';
  } else {
    if(r(pfx+'-art')) r(pfx+'-art').value='';
    r(pfx+'-parsed').classList.add('hidden');
    if(r(pfx+'-raw')) r(pfx+'-raw').textContent='';
    if(r(pfx+'-art-err')) r(pfx+'-art-err').style.display='none';
  }
  // Update session
  if(!scanSession[pfx]) scanSession[pfx] = [];
  const now2 = new Date();
  const timeStr = now2.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  scanSession[pfx].push({artno:p.artno, groesse:p.groesse, ts:timeStr});
  const done = scanSession[pfx].length;
  const total = qty;

  // Update progress UI
  const progEl = r(pfx+'-progress');
  if(progEl) {
    progEl.classList.remove('hidden');
    r(pfx+'-prog-done').textContent = done;
    r(pfx+'-prog-total').textContent = total;
    const pct = Math.round((done/total)*100);
    r(pfx+'-prog-bar').style.width = pct+'%';
    r(pfx+'-prog-bar').style.background = done>=total ? 'var(--green)' : 'var(--blue)';
    // Rebuild scan list
    const listEl = r(pfx+'-scan-list');
    listEl.innerHTML = scanSession[pfx].map((s,i)=>`
      <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--surface2);border-radius:var(--radius-sm);font-size:13px;">
        <span style="width:20px;height:20px;border-radius:50%;background:var(--green-light);color:var(--green-text);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;">${i+1}</span>
        <span style="font-family:'DM Mono',monospace;flex:1;">${s.artno}</span>
        <span style="background:var(--green-light);color:var(--green-text);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:600;">${s.groesse}</span>
        <span style="color:var(--text3);font-size:11px;">${s.ts}</span>
      </div>`).join('');
    // Scroll to bottom
    listEl.scrollTop = listEl.scrollHeight;
  }

  const fb = r(pfx+'-fb');
  if(done >= total) {
    fb.textContent = '✓ Alle '+total+' Artikel erfasst!';
    fb.style.color = 'var(--green)';
    // Reset session after short delay so user sees completion
    setTimeout(()=>{
      if(fb) { fb.textContent=''; }
      scanSession[pfx] = [];
      if(r(pfx+'-qty')) r(pfx+'-qty').value='';
      if(r(pfx+'-order')) r(pfx+'-order').value='';
      if(r(pfx+'-progress')) r(pfx+'-progress').classList.add('hidden');
      checkSubmit(pfx);
      if(r(pfx+'-qty')) r(pfx+'-qty').focus();
    }, 2500);
  } else {
    fb.textContent = '✓ '+done+' von '+total+' – nächsten Artikel scannen';
    setTimeout(()=>{if(fb)fb.textContent='';},2000);
  }

  r(pfx+'-submit').disabled=true;
  // Clear order field for next scan, keep qty
  if(r(pfx+'-order')) r(pfx+'-order').value='';
  if(r(pfx+'-order-err')) r(pfx+'-order-err').style.display='none';
  // Focus back to order field for next bestellnummer scan
  const done2 = (scanSession[pfx]||[]).length;
  const total2 = getQty(pfx);
  if(done2 < total2) {
    setTimeout(()=>{ const o=r(pfx+'-order'); if(o) o.focus(); },100);
  }
  const lc = r('nav-log'); if(lc) lc.querySelector('.cnt').textContent=DB.log.length;
};

function formatDisplayTS(ts) {
  if(!ts) return '–';
  const s = String(ts).trim();
  // Already correct German format: "21.5.2026 12:33:26"
  if(s.match(/^\d{1,2}\.\d{1,2}\.\d{4} \d{2}:\d{2}:\d{2}$/)) return s;
  // Google Sheets date object serialized as locale string (e.g. "5/21/2026, 10:33:26")
  // or ISO string - parse and reformat
  const d = new Date(s);
  if(isNaN(d.getTime())) return s;
  const day   = d.getDate();
  const month = d.getMonth() + 1;
  const year  = d.getFullYear();
  const hh    = String(d.getHours()).padStart(2,'0');
  const mm    = String(d.getMinutes()).padStart(2,'0');
  const sec   = String(d.getSeconds()).padStart(2,'0');
  return day+'.'+month+'.'+year+' '+hh+':'+mm+':'+sec;
}

    <tbody>${entries.map((e,i)=>`<tr>

    </tr>`).join('')}</tbody>
  </table>`;
}
function bindLogFilters() {
  window.applyFilters = function() {
    const ord = (r('f-order')||{value:''}).value.trim().replace(/^\*+/,'').toLowerCase();
    const art = (r('f-art')||{value:''}).value.trim().toLowerCase();
    const von = (r('f-von')||{value:''}).value;
    const nach = (r('f-nach')||{value:''}).value;
    const date = (r('f-date')||{value:''}).value;
    const res = DB.log.filter(e=>{
      if(ord && !e.order.toLowerCase().includes(ord)) return false;
      if(art && !e.artno.toLowerCase().includes(art)) return false;
      if(von && e.fili!==von) return false;
      if(nach && e.dest!==nach) return false;
      if(date) {
        const [y,m,d] = date.split('-');
        const dateStr = parseInt(d)+'.'+ parseInt(m)+'.'+y;
        if(!formatDisplayTS(e.ts).startsWith(dateStr)) return false;
      }
      return true;
    });
    const t=r('log-tbl'); if(t) t.innerHTML=renderLogTable(res);
    const i=r('log-info'); if(i) i.textContent=res.length+' Einträge';
  };
}
window.exportCSV = function() {
  const ord=(r('f-order')||{value:''}).value.trim().replace(/^\*+/,'').toLowerCase();
  const art=(r('f-art')||{value:''}).value.trim().toLowerCase();
  const von=(r('f-von')||{value:''}).value;
  const nach=(r('f-nach')||{value:''}).value;
  const date=(r('f-date')||{value:''}).value;
  const entries=DB.log.filter(e=>{
    if(ord&&!e.order.toLowerCase().includes(ord)) return false;
    if(art&&!e.artno.toLowerCase().includes(art)) return false;
    if(von&&e.fili!==von) return false;
    if(nach&&e.dest!==nach) return false;
    if(date) {
      const [y,m,d] = date.split('-');
      const dateStr = `${parseInt(d)}.${parseInt(m)}.${y}`;
      if(!e.ts.startsWith(dateStr)) return false;
    }
    return true;
  });
  if(!entries.length) return;
  const hdr=['Zeitstempel','Von Filiale','Nach Filiale','Bestellnummer','Artikelnummer','Größe','Format','Standort','Rohbarcode'];
  const rows=entries.map(e=>[e.ts,'Fili '+e.fili,'Fili '+e.dest,e.order,e.artno,e.groesse,e.format,e.user||'–',e.rawBarcode]);
  const csv=[hdr,...rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='versandlog_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  URL.revokeObjectURL(url);
};

function parseDateInput(dateStr) {
  if(!dateStr) return null;
  const [y,m,d] = dateStr.split('-');
  return new Date(parseInt(y), parseInt(m)-1, parseInt(d));
}

function entryDate(e) {
  // ts format: "20.5.2026 15:09:22"
  const parts = e.ts.split(' ')[0].split('.');
  return new Date(parseInt(parts[2]), parseInt(parts[1])-1, parseInt(parts[0]));
}

function filterByDateRange(from, to) {
  const fromD = parseDateInput(from);
  const toD = parseDateInput(to);
  if(toD) toD.setHours(23,59,59);
  return DB.log.filter(e => {
    const d = entryDate(e);
    if(fromD && d < fromD) return false;
    if(toD && d > toD) return false;
    return true;
  });
}

};

  const from = (r('exp-from')||{value:''}).value;

}
function updateDelPreview() {
  const from = (r('del-from')||{value:''}).value;
  const to = (r('del-to')||{value:''}).value;
  const entries = filterByDateRange(from, to);

document.addEventListener('change', function(e) {

  if(e.target.id==='del-from'||e.target.id==='del-to') updateDelPreview();

window.exportByDate = function() {
  const from = (r('exp-from')||{value:''}).value;
  const to = (r('exp-to')||{value:''}).value;
  const entries = filterByDateRange(from, to);
  if(!entries.length) { alert('Keine Einträge im gewählten Zeitraum.'); return; }
  const hdr = ['Zeitstempel','Von Filiale','Nach Filiale','Bestellnummer','Artikelnummer','Größe','Format','Standort','Rohbarcode'];
  const rows = entries.map(e=>[e.ts,'Fili '+e.fili,'Fili '+e.dest,e.order,e.artno,e.groesse,e.format||'',e.user||'–',e.rawBarcode||'']);
  const csv = [hdr,...rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const fromLabel = from ? from.split('-').reverse().join('.') : 'Anfang';
  const toLabel = to ? to.split('-').reverse().join('.') : 'Ende';
  const a = document.createElement('a');
  a.href=url; a.download=`versandlog_${fromLabel}_bis_${toLabel}.csv`; a.click();
  URL.revokeObjectURL(url);
};

window.deleteByDate = function() {
  const from = (r('del-from')||{value:''}).value;
  const to = (r('del-to')||{value:''}).value;
  if(!from && !to) { alert('Bitte mindestens ein Datum angeben.'); return; }
  const entries = filterByDateRange(from, to);
  if(!entries.length) { alert('Keine Einträge im gewählten Zeitraum.'); return; }
  const fromLabel = from ? from.split('-').reverse().join('.') : 'Anfang';
  const toLabel = to ? to.split('-').reverse().join('.') : 'Ende';
  if(!confirm(`${entries.length} Einträge vom ${fromLabel} bis ${toLabel} unwiderruflich löschen?

Tipp: Erst exportieren, dann löschen!`)) return;
  DB.log = DB.log.filter(e => !entries.includes(e));
  saveDB();
  // Delete from API
  apiPost({action:'deleteDateRange', from: from||null, to: to||null});
  document.getElementById('delete-date-panel').classList.add('hidden');
  // Refresh log view
  const lc = r('nav-log'); if(lc) lc.querySelector('.cnt').textContent=DB.log.length;
  document.querySelector('.stat-card:nth-child(1) .sv').textContent = DB.log.length;
  const todayCount = DB.log.filter(e=>e.ts.startsWith(new Date().toLocaleDateString('de-DE'))).length;
  document.querySelector('.stat-card:nth-child(2) .sv').textContent = todayCount;
  document.querySelector('.stat-card:nth-child(3) .sv').textContent = [...new Set(DB.log.map(e=>e.fili))].length;
  applyFilters();
};

window.resetSession = function(pfx) {
  if(!(scanSession[pfx]||[]).length) return;
  if(!confirm('Alle ' + scanSession[pfx].length + ' gescannten Artikel dieser Session löschen und von vorne anfangen?')) return;
  scanSession[pfx] = [];
  const progEl = r(pfx+'-progress');
  if(progEl) progEl.classList.add('hidden');
  if(r(pfx+'-order')) r(pfx+'-order').value='';
  if(r(pfx+'-art')) r(pfx+'-art').value='';
  if(r(pfx+'-parsed')) r(pfx+'-parsed').classList.add('hidden');
  if(r(pfx+'-raw')) r(pfx+'-raw').textContent='';
  if(r(pfx+'-order-err')) r(pfx+'-order-err').style.display='none';
  if(r(pfx+'-art-err')) r(pfx+'-art-err').style.display='none';
  checkSubmit(pfx);
  setTimeout(()=>{ const o=r(pfx+'-order'); if(o) o.focus(); },100);
};

window.deleteEntry = function(idx) {
  if(idx < 0 || idx >= DB.log.length) return;
  if(!confirm('Eintrag löschen?')) return;
  const entry = DB.log[idx];
  DB.log.splice(idx, 1);
  saveDB();
  if(entry && entry.rowIndex) apiPost({action:'deleteLog', rowIndex: entry.rowIndex});
  // Re-render log view
  const logDiv = document.getElementById('view-log');
  if(logDiv) {
    const todayCount = DB.log.filter(e=>e.ts.startsWith(new Date().toLocaleDateString('de-DE'))).length;
    document.querySelector('.stat-card:nth-child(1) .sv').textContent = DB.log.length;
    document.querySelector('.stat-card:nth-child(2) .sv').textContent = todayCount;
    document.querySelector('.stat-card:nth-child(3) .sv').textContent = [...new Set(DB.log.map(e=>e.fili))].length;
    const lc = document.getElementById('nav-log'); if(lc) lc.querySelector('.cnt').textContent=DB.log.length;
    applyFilters();
  }
};

function tplUsers() {
  return `<div class="card">
    <div class="card-title">Neuen Admin anlegen</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div><label class="field-lbl">Login-ID</label><input type="text" id="u-id" placeholder="z.B. admin2" /></div>
      <div><label class="field-lbl">Anzeigename</label><input type="text" id="u-name" placeholder="z.B. Maria" /></div>
      <div><label class="field-lbl">Passwort</label><input type="password" id="u-pass" placeholder="Passwort..." /></div>
      <div style="display:flex;align-items:flex-end;"><button class="btn btn-primary" id="u-add">${icons.plus} Anlegen</button></div>
    </div>
    <div class="err-msg" id="u-err"></div>
  </div>
  <div class="card">
    <div class="card-title">Admin-Zugänge</div>
    <div id="user-list">${renderUserList()}</div>
  </div>`;
}
function renderUserList() {
  return DB.users.map(u=>`
    <div class="user-row">
      <div class="u-avatar">${u.name.slice(0,2).toUpperCase()}</div>
      <div style="flex:1;">
        <div style="font-weight:600;font-size:13.5px;">${u.name}</div>
        <div style="font-size:12px;color:var(--text2);font-family:'DM Mono',monospace;">@${u.id}</div>
      </div>
      <span class="badge badge-admin">Admin</span>
      ${u.id!=='admin'?`<button class="btn btn-sm btn-danger" onclick="delUser('${u.id}')">${icons.trash}</button>`:''}
    </div>`).join('');
}
function bindUserForm() {
  r('u-add').onclick=()=>{
    const id=r('u-id').value.trim(),name=r('u-name').value.trim(),pass=r('u-pass').value;
    const errEl=r('u-err');
    if(!id||!name||!pass){errEl.textContent='Alle Felder ausfüllen.';errEl.style.display='block';return;}
    if(DB.users.find(u=>u.id===id)){errEl.textContent='Login-ID bereits vergeben.';errEl.style.display='block';return;}
    errEl.style.display='none';
    DB.users.push({id,name,password:pass,role:'admin'});
    saveDB();
    apiPost({action:'addUser', id, name, password:pass, role:'admin'});
    r('u-id').value=''; r('u-name').value=''; r('u-pass').value='';
    r('user-list').innerHTML=renderUserList();
    r('nav-users').querySelector('.cnt').textContent=DB.users.length;
  };
  window.delUser=id=>{
    if(id==='admin') return;
    const user = DB.users.find(u=>u.id===id);
    DB.users=DB.users.filter(u=>u.id!==id);
    saveDB();
    if(user && user.rowIndex) apiPost({action:'deleteUser', id, rowIndex:user.rowIndex});
    r('user-list').innerHTML=renderUserList();
    r('nav-users').querySelector('.cnt').textContent=DB.users.length;
  };
}

render();

// Register Service Worker for offline support
if('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'versand-v1';
const ASSETS = [location.href];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys =>
    Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))
  ));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  e.respondWith(
    caches.match(e.request).then(cached => {
      if(cached) return cached;
      return fetch(e.request).then(resp => {
        const clone = resp.clone();
        caches.open(CACHE).then(c => c.put(e.request, clone));
        return resp;
      }).catch(() => cached || new Response('Offline', {status: 503}));
    })
  );
});`;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
